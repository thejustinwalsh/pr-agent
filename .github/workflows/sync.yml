name: sync-upstream
on:
  schedule:
    - cron: "0 9 * * *"   # 09:00 UTC daily
  workflow_dispatch: {}
permissions:
  contents: write
  actions: write   # to dispatch build-image after a successful sync
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "pr-agent-bot"
          git config user.email "bot@users.noreply.github.com"
      - name: Find newest upstream release tag
        id: up
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh release view --repo The-PR-Agent/pr-agent --json tagName -q .tagName)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Merge upstream tag into production if new
        id: merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.up.outputs.tag }}"
          if git tag --list | grep -qx "$TAG"; then echo "already have $TAG"; echo "synced=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git remote add upstream https://github.com/The-PR-Agent/pr-agent.git
          git fetch upstream --tags
          # Merge will fail the job (and email) on conflict — by design.
          git merge --no-edit "$TAG"
          git push origin production
          gh release create "$TAG" --repo "${{ github.repository }}" --title "$TAG" --notes "Synced from upstream $TAG"
          echo "synced=true" >> "$GITHUB_OUTPUT"
      # Releases created with GITHUB_TOKEN do NOT trigger build-image (GitHub's
      # recursion guard), so dispatch it explicitly — workflow_dispatch IS allowed
      # under GITHUB_TOKEN. This makes sync -> build -> (box deploy timer) hands-off.
      - name: Build the image for the new release
        if: steps.merge.outputs.synced == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run build-image --repo "${{ github.repository }}" \
            --ref production -f tag="${{ steps.up.outputs.tag }}"
