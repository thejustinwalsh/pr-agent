name = "tjw-secrets-broker"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
routes = [
  { pattern = "secrets.tjw.dev", custom_domain = true }
]

# Shared secrets broker (secrets.tjw.dev), path-scoped per namespace. Each binding
# below is a value in the `pr-agent` bundle (src/index.ts BUNDLES["pr-agent"]).
#
# store_id is the account's SINGLE default Workers Secrets Store (one store / 100
# secrets per account). Get it from the dashboard or `wrangler secrets-store store
# list`. All bindings share that store_id. The pr-agent-* secrets must exist in the
# store before `wrangler deploy` (see the cloudflare runbook, Part 3).
#
# To add a future project: register its bundle in src/index.ts and add its
# <project>-* secrets as bindings here (use distinct binding names per namespace).

[[secrets_store_secrets]]
binding = "DEEPSEEK_API_KEY"
store_id = "a82a58437ef14b80bcba87a7d5589377"
secret_name = "pr-agent-deepseek-key"

[[secrets_store_secrets]]
binding = "GITHUB_APP_PRIVATE_KEY"
store_id = "a82a58437ef14b80bcba87a7d5589377"
secret_name = "pr-agent-github-app-key"

[[secrets_store_secrets]]
binding = "GITHUB_APP_ID"
store_id = "a82a58437ef14b80bcba87a7d5589377"
secret_name = "pr-agent-github-app-id"

[[secrets_store_secrets]]
binding = "GITHUB_WEBHOOK_SECRET"
store_id = "a82a58437ef14b80bcba87a7d5589377"
secret_name = "pr-agent-webhook-secret"

[[secrets_store_secrets]]
binding = "TUNNEL_CRED"
store_id = "a82a58437ef14b80bcba87a7d5589377"
secret_name = "pr-agent-tunnel-cred"


# NOTE: no [vars] here on purpose. `[vars]` would be deployed to the Worker as
# PLAINTEXT env vars and committed to git — a leak trap, and it would collide with
# the same-named Secrets Store bindings in production. Test stub bindings live in
# vitest.config.ts (miniflare.bindings). This file carries zero secret values.
