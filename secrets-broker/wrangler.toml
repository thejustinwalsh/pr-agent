name = "tjw-secrets-broker"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
routes = [
  { pattern = "secrets.tjw.dev", custom_domain = true }
]
# Reachable ONLY via the Access-gated custom domain — no *.workers.dev bypass route.
workers_dev = false

# Shared secrets broker (secrets.tjw.dev), path-scoped per namespace. The five
# `pr-agent` secrets (src/index.ts BUNDLES["pr-agent"]) are NOT declared here —
# they are **Worker secrets**, set in one shot by `deploy/set-broker-secrets.sh`
# (`wrangler secret put`). Why not the Secrets Store: its value cap is 1024 chars
# and a base64 RSA-2048 GitHub App PEM is ~2.2 KB, so the PEM cannot live there;
# rather than split storage across two mechanisms, all five are Worker secrets
# (no size cap, one uniform flow). The broker reads each as a plain string binding
# (resolve() handles string | Secrets Store object).
#
# To add a future project: register its bundle in src/index.ts and set its secrets
# as Worker secrets (distinct binding names per namespace).

# OTP single-use store. The Worker only reads + deletes (minting is CLI-only:
# wrangler kv key put). Create with `wrangler kv namespace create OTP_KV` and
# paste the returned id here (and into deploy/cloud-init.vars as OTP_KV_ID).
[[kv_namespaces]]
binding = "OTP_KV"
id = "REPLACE_WITH_OTP_KV_ID"


# NOTE: no [vars] here on purpose. `[vars]` would be deployed to the Worker as
# PLAINTEXT env vars and committed to git — a leak trap, and it would collide with
# the same-named Worker secrets in production. Test stub bindings live in
# vitest.config.ts (miniflare.bindings). This file carries zero secret values.
